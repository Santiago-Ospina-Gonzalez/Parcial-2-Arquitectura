@switch(state){

    @case('loading'){
        <app-alert alertState="loading" text="Cargando Pacientes..." ></app-alert>
    }

    @case('error'){
        <app-alert alertState="error" text="Error al Cargar los Pacientes" ></app-alert>
    }

    @case('success'){
        <app-patients-table [patients]="patients" ></app-patients-table>
    }

}
