<section class="container py-4"><h1>Citas</h1><div class="table-responsive"><table class="table table-striped"><thead><tr><th>ID</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>@for (appointment of appointments; track appointment.id) {<tr><td>{{ appointment.id }}</td><td>{{ appointment.customerName }}</td><td>{{ appointment.total | currency }}</td><td>{{ appointment.status }}</td><td>{{ appointment.createdAt | date:'short' }}</td></tr>}</tbody></table></div></section>
