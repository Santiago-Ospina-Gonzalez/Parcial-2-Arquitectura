<section class="container py-4"><h1>Órdenes</h1><div class="table-responsive"><table class="table table-striped"><thead><tr><th>ID</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>@for (order of orders; track order.id) {<tr><td>{{ order.id }}</td><td>{{ order.customerName }}</td><td>{{ order.total | currency }}</td><td>{{ order.status }}</td><td>{{ order.createdAt | date:'short' }}</td></tr>}</tbody></table></div></section>
