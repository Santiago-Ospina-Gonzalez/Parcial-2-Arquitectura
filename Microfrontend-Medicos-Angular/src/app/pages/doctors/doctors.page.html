@switch(state){

    @case('loading'){
        <app-alert alertState="loading" text="Cargando Médicos..." ></app-alert>
    }

    @case('error'){
        <app-alert alertState="error" text="Error al Cargar los Médicos" ></app-alert>
    }

    @case('success'){
        <app-doctors-table [doctors]="doctors" ></app-doctors-table>
    }

}
